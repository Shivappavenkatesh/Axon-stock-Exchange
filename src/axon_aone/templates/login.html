<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon Trading - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container login-container">
        <div class="login-card">
            <h1 class="login-title">🔐 Axon Trading</h1>
            <p class="login-subtitle">Sign in to access the trading dashboard</p>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="post" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-submit login-button">Login</button>
            </form>
        </div>

        <footer class="footer login-footer">
            <p>Axon Trading v1.0 | Secure Access</p>
        </footer>
    </div>
</body>
</html>
