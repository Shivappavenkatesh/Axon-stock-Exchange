apiVersion: v1
kind: ServiceAccount
metadata:
  name: axon-aone
  namespace: axon-aone
  labels:
    app: axon-aone

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axon-aone
  namespace: axon-aone
  labels:
    app: axon-aone
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axon-aone
  namespace: axon-aone
  labels:
    app: axon-aone
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: axon-aone
subjects:
  - kind: ServiceAccount
    name: axon-aone
    namespace: axon-aone
