name: Deploy to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY_NAME: axonaoneacr
  IMAGE_NAME: axon-aone
  AZURE_RESOURCE_GROUP: axon-aone-rg
  AZURE_LOCATION: centralindia

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        id: build
        run: |
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.ref_name }} .
          echo "digest=$(az acr repository show-manifest --name ${{ env.REGISTRY_NAME }} --repository ${{ env.IMAGE_NAME }} --tag latest --query 'id' -o tsv)" >> $GITHUB_OUTPUT

      - name: Logout of Azure
        run: az logout

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  deploy-aci:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or update container instance
        run: |
          # Check if container group exists
          if az container show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
             --name ${{ env.IMAGE_NAME }}-aci 2>/dev/null; then
            echo "Updating existing container instance..."
            az container delete --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.IMAGE_NAME }}-aci --yes
          fi
          
          # Create new container instance
          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_NAME }}-aci \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            --registry-login-server ${{ env.REGISTRY_NAME }}.azurecr.io \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --environment-variables \
              ANGEL_ONE_API_KEY='${{ secrets.ANGEL_ONE_API_KEY }}' \
              ANGEL_ONE_CLIENT_ID='${{ secrets.ANGEL_ONE_CLIENT_ID }}' \
              ANGEL_ONE_PIN='${{ secrets.ANGEL_ONE_PIN }}' \
              ANGEL_ONE_TOTP_SECRET='${{ secrets.ANGEL_ONE_TOTP_SECRET }}' \
              MOCK_MODE='false' \
              TZ='Asia/Kolkata' \
              PYTHONUNBUFFERED='1' \
            --memory 2 \
            --cpu 1 \
            --restart-policy Always \
            --command-line "python run_trader.py --schedule"

      - name: Wait for deployment
        run: sleep 15

      - name: Get container status
        run: |
          az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_NAME }}-aci \
            --query "{ Name: name, State: containers[0].instanceView.currentState.state, CPU: containers[0].resources.requests.cpu, Memory: containers[0].resources.requests.memoryInGb }" \
            -o table

      - name: Stream logs
        run: |
          az container logs \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.IMAGE_NAME }}-aci \
            --tail 50

      - name: Logout of Azure
        run: az logout

  notify:
    runs-on: ubuntu-latest
    needs: [build, test, deploy-aci]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          echo "Build Status: ${{ needs.build.result }}"
          echo "Test Status: ${{ needs.test.result }}"
          echo "Deploy Status: ${{ needs.deploy-aci.result }}"
          
          if [[ "${{ needs.deploy-aci.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
          elif [[ "${{ needs.deploy-aci.result }}" == "skipped" ]]; then
            echo "⏭️  Deployment skipped (only runs on main branch)"
          else
            echo "❌ Deployment failed or tested only"
          fi
