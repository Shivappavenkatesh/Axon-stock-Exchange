[tool.poetry]
name = "axon-aone"
version = "1.0.0"
description = "Angel One Smart API automated trading scheduler with multi-user container support"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21"
pandas = "^1.3"
requests = "^2.26"
matplotlib = "^3.4"
scikit-learn = "^0.24"
apscheduler = "^3.10.0"
pytz = "^2021.3"
smartapi-python = "^1.3.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-cov = "^3.0.0"

[tool.pytest.ini_options]
filterwarnings = [
	# Suppress known deprecations coming from the SmartApi library
	"ignore::DeprecationWarning:SmartApi.smartConnect",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
