# One VM with the static IP registered at Angel One. Two containers share one ledger.
# The dashboard is published on 127.0.0.1 only: open it through an SSH tunnel
#   ssh -L 8080:127.0.0.1:8080 user@your-server   then browse http://localhost:8080
services:
  trader:
    build: .
    env_file: .env
    environment:
      AXON_DB_PATH: /app/data/axon.sqlite3
      AXON_REPORTS_DIR: /app/reports
    volumes:
      - axon-data:/app/data
      - axon-reports:/app/reports
    restart: unless-stopped
    labels:
      autoheal: "true"

  web:
    build: .
    command: ["python", "-m", "axon", "web"]
    env_file: .env
    environment:
      AXON_DB_PATH: /app/data/axon.sqlite3
      AXON_WEB_HOST: 0.0.0.0          # inside the container; published to localhost only below
    volumes:
      - axon-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 1m
    restart: unless-stopped

  # Docker does not restart unhealthy containers on its own; this restarts the trader
  # when its health check fails (finding 14: restart within 15 minutes).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  axon-data:
  axon-reports:
